apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "polardb-for-postgresql.polardbName" . }}
  labels:
    {{- include "polardb-for-postgresql.polardbLabels" . | nindent 4 }}
    {{- with .Values.polardb.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.polardb.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  serviceName: {{ include "polardb-for-postgresql.polardbHeadlessServiceName" . }}
  replicas: {{ ternary .Values.ha.replicaCount .Values.polardb.replicaCount .Values.ha.enabled }}
  podManagementPolicy: {{ ternary .Values.ha.podManagementPolicy .Values.polardb.podManagementPolicy .Values.ha.enabled }}
  selector:
    matchLabels:
      {{- include "polardb-for-postgresql.polardbSelectorLabels" . | nindent 6 }}
  updateStrategy:
    {{- toYaml (ternary .Values.ha.updateStrategy .Values.polardb.updateStrategy .Values.ha.enabled) | nindent 4 }}
  {{- if and .Values.polardb.persistence.enabled .Values.polardb.persistence.persistentVolumeClaimRetentionPolicy.enabled }}
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: {{ .Values.polardb.persistence.persistentVolumeClaimRetentionPolicy.whenDeleted }}
    whenScaled: {{ .Values.polardb.persistence.persistentVolumeClaimRetentionPolicy.whenScaled }}
  {{- end }}
  template:
    metadata:
      labels:
        {{- include "polardb-for-postgresql.polardbSelectorLabels" . | nindent 8 }}
        {{- if .Values.ha.enabled }}
        polardb-role: unknown
        {{- end }}
        {{- with .Values.polardb.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.polardb.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.polardb.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.ha.enabled }}
      serviceAccountName: {{ include "polardb-for-postgresql.polardbServiceAccountName" . }}
      shareProcessNamespace: {{ .Values.ha.shareProcessNamespace }}
      {{- end }}
      containers:
        - name: polardb
          image: {{ .Values.polardb.image | quote }}
          imagePullPolicy: {{ .Values.polardb.imagePullPolicy }}
          {{- with .Values.polardb.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: postgres
              containerPort: {{ .Values.polardb.port }}
              protocol: TCP
          env:
            - name: POLARDB_ENABLE_DOCUMENTDB
              value: {{ ternary "1" "0" .Values.ferretdb.enabled | quote }}
            - name: POLARDB_USER
              value: {{ .Values.auth.user | quote }}
            - name: POLARDB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "polardb-for-postgresql.secretName" . }}
                  key: password
            - name: POLARDB_PORT
              value: {{ .Values.polardb.port | quote }}
            - name: POLARDB_DATA_DIR
              value: /var/polardb
            {{- if .Values.ha.enabled }}
            - name: POLARDB_HA_ENABLED
              value: "1"
            - name: POLARDB_HA_PRIMARY_HOST
              value: {{ include "polardb-for-postgresql.polardbServiceName" . | quote }}
            - name: POLARDB_HA_BOOTSTRAP_PRIMARY_HOST
              value: {{ printf "%s-0.%s" (include "polardb-for-postgresql.polardbName" .) (include "polardb-for-postgresql.polardbHeadlessServiceName" .) | quote }}
            - name: POLARDB_HA_REJOIN_PRIMARY_HOST
              value: {{ include "polardb-for-postgresql.polardbServiceName" . | quote }}
            - name: POLARDB_HA_PRIMARY_WAIT_SECONDS
              value: {{ .Values.ha.primaryWaitSeconds | quote }}
            - name: POLARDB_HA_WAL_KEEP_SIZE
              value: {{ .Values.ha.replication.walKeepSize | quote }}
            - name: POLARDB_HA_MAX_WAL_SENDERS
              value: {{ .Values.ha.replication.maxWalSenders | quote }}
            - name: POLARDB_HA_MAX_REPLICATION_SLOTS
              value: {{ .Values.ha.replication.maxReplicationSlots | quote }}
            - name: POLARDB_HA_SYNCHRONOUS_REPLICATION_ENABLED
              value: {{ ternary "1" "0" .Values.ha.replication.synchronous.enabled | quote }}
            - name: POLARDB_HA_SYNCHRONOUS_COMMIT
              value: {{ .Values.ha.replication.synchronous.commit | quote }}
            - name: POLARDB_HA_SYNCHRONOUS_STANDBY_NAMES
              value: {{ .Values.ha.replication.synchronous.standbyNames | quote }}
            - name: POLARDB_HA_REBUILD_DEMOTED
              value: {{ ternary "1" "0" .Values.ha.rejoin.rebuildDemoted | quote }}
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            {{- end }}
            {{- with .Values.polardb.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          volumeMounts:
            - name: data
              mountPath: /var/polardb
            {{- with .Values.polardb.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.polardb.startupProbe }}
          startupProbe:
            exec:
              command:
                - /bin/bash
                - -ec
                - pg_isready -U "${POLARDB_USER:-postgres}" -p "${POLARDB_PORT:-5432}" -d {{ $.Values.auth.database | quote }}
            initialDelaySeconds: {{ .initialDelaySeconds }}
            periodSeconds: {{ .periodSeconds }}
            timeoutSeconds: {{ .timeoutSeconds }}
            failureThreshold: {{ .failureThreshold }}
          {{- end }}
          {{- with .Values.polardb.livenessProbe }}
          livenessProbe:
            exec:
              command:
                - /bin/bash
                - -ec
                - pg_isready -U "${POLARDB_USER:-postgres}" -p "${POLARDB_PORT:-5432}" -d {{ $.Values.auth.database | quote }}
            initialDelaySeconds: {{ .initialDelaySeconds }}
            periodSeconds: {{ .periodSeconds }}
            timeoutSeconds: {{ .timeoutSeconds }}
            failureThreshold: {{ .failureThreshold }}
          {{- end }}
          {{- with .Values.polardb.readinessProbe }}
          readinessProbe:
            exec:
              command:
                - /bin/bash
                - -ec
                - pg_isready -U "${POLARDB_USER:-postgres}" -p "${POLARDB_PORT:-5432}" -d {{ $.Values.auth.database | quote }}
            initialDelaySeconds: {{ .initialDelaySeconds }}
            periodSeconds: {{ .periodSeconds }}
            timeoutSeconds: {{ .timeoutSeconds }}
            failureThreshold: {{ .failureThreshold }}
          {{- end }}
          resources:
            {{- toYaml .Values.polardb.resources | nindent 12 }}
        {{- if .Values.ha.enabled }}
        - name: ha-manager
          image: {{ .Values.polardb.image | quote }}
          imagePullPolicy: {{ .Values.polardb.imagePullPolicy }}
          command:
            - /usr/bin/python3
            - /home/postgres/polardb-ha-manager.py
          env:
            - name: POLARDB_USER
              value: {{ .Values.auth.user | quote }}
            - name: POLARDB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "polardb-for-postgresql.secretName" . }}
                  key: password
            - name: POLARDB_PORT
              value: {{ .Values.polardb.port | quote }}
            - name: POLARDB_DATA_DIR
              value: /var/polardb
            - name: POLARDB_HA_LEASE_NAME
              value: {{ include "polardb-for-postgresql.polardbLeaseName" . | quote }}
            - name: POLARDB_HA_LEASE_DURATION_SECONDS
              value: {{ .Values.ha.leaseDurationSeconds | quote }}
            - name: POLARDB_HA_RETRY_PERIOD_SECONDS
              value: {{ .Values.ha.retryPeriodSeconds | quote }}
            - name: POLARDB_HA_FAILOVER_ENABLED
              value: {{ ternary "1" "0" .Values.ha.failover.enabled | quote }}
            - name: POLARDB_HA_PROMOTE_TIMEOUT_SECONDS
              value: {{ .Values.ha.failover.promoteTimeoutSeconds | quote }}
            - name: POLARDB_HA_MAXIMUM_LAG_ON_FAILOVER_BYTES
              value: {{ .Values.ha.failover.maximumLagOnFailoverBytes | quote }}
            - name: POLARDB_HA_CHECK_TIMELINE
              value: {{ ternary "1" "0" .Values.ha.failover.checkTimeline | quote }}
            - name: POLARDB_HA_PRIMARY_HOST
              value: {{ include "polardb-for-postgresql.polardbServiceName" . | quote }}
            - name: POLARDB_HA_PRIMARY_HEADLESS_TEMPLATE
              value: {{ printf "$(POD_NAME).%s" (include "polardb-for-postgresql.polardbHeadlessServiceName" .) | quote }}
            - name: POLARDB_HA_POD_LABEL_SELECTOR
              value: {{ include "polardb-for-postgresql.polardbLabelSelector" . | quote }}
            - name: POLARDB_HA_HTTP_PORT
              value: {{ .Values.ha.manager.httpPort | quote }}
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          ports:
            - name: ha-http
              containerPort: {{ .Values.ha.manager.httpPort }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: ha-http
            initialDelaySeconds: {{ .Values.ha.manager.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.ha.manager.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.ha.manager.livenessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.ha.manager.livenessProbe.failureThreshold }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: ha-http
            initialDelaySeconds: {{ .Values.ha.manager.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.ha.manager.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.ha.manager.readinessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.ha.manager.readinessProbe.failureThreshold }}
          volumeMounts:
            - name: data
              mountPath: /var/polardb
          resources:
            {{- toYaml .Values.ha.manager.resources | nindent 12 }}
        {{- end }}
      {{- with .Values.polardb.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.polardb.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.polardb.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if or (not .Values.polardb.persistence.enabled) .Values.polardb.extraVolumes }}
      volumes:
        {{- if not .Values.polardb.persistence.enabled }}
        - name: data
          emptyDir: {}
        {{- end }}
        {{- with .Values.polardb.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
  {{- if .Values.polardb.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
        {{- with .Values.polardb.persistence.annotations }}
        annotations:
          {{- toYaml . | nindent 10 }}
        {{- end }}
      spec:
        accessModes:
          {{- toYaml .Values.polardb.persistence.accessModes | nindent 10 }}
        {{- if .Values.polardb.persistence.storageClass }}
        storageClassName: {{ .Values.polardb.persistence.storageClass | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.polardb.persistence.size | quote }}
  {{- end }}
