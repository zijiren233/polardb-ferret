{{- if not .Values.auth.existingSecret }}
{{- $secretName := include "polardb-for-postgresql.secretName" . }}
{{- $password := .Values.auth.password }}
{{- $existingSecret := lookup "v1" "Secret" .Release.Namespace $secretName }}
{{- if and (not $password) $existingSecret (hasKey $existingSecret.data "password") }}
{{- $password = index $existingSecret.data "password" | b64dec }}
{{- else if and (not $password) $existingSecret (hasKey $existingSecret.data "polardb-password") }}
{{- $password = index $existingSecret.data "polardb-password" | b64dec }}
{{- end }}
{{- if not $password }}
{{- $password = randAlphaNum 32 }}
{{- end }}
{{- $user := .Values.auth.user }}
{{- $database := .Values.auth.database }}
{{- $host := include "polardb-for-postgresql.polardbServiceName" . }}
{{- $port := .Values.polardb.port | int }}
{{- $postgresqlUrl := printf "postgres://%s:%s@%s:%v/%s?sslmode=disable" (urlquery $user) (urlquery $password) $host $port (urlquery $database) }}
{{- $ferretdbHost := include "polardb-for-postgresql.ferretdbName" . }}
{{- $ferretdbPort := .Values.ferretdb.service.port | int }}
{{- $ferretdbUrl := printf "mongodb://%s:%s@%s:%v/%s?authSource=%s&directConnection=true" (urlquery $user) (urlquery $password) $ferretdbHost $ferretdbPort (urlquery $database) (urlquery $database) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "polardb-for-postgresql.labels" . | nindent 4 }}
type: Opaque
data:
  username: {{ $user | b64enc | quote }}
  password: {{ $password | b64enc | quote }}
  polardb-password: {{ $password | b64enc | quote }}
  database: {{ $database | b64enc | quote }}
  host: {{ $host | b64enc | quote }}
  port: {{ printf "%v" $port | b64enc | quote }}
  postgresql-url: {{ $postgresqlUrl | b64enc | quote }}
  {{- if .Values.ferretdb.enabled }}
  ferretdb-postgresql-url: {{ $postgresqlUrl | b64enc | quote }}
  ferretdb-url: {{ $ferretdbUrl | b64enc | quote }}
  {{- end }}
{{- end }}
