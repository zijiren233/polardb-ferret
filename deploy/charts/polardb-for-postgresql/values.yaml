nameOverride: ""
fullnameOverride: ""

imagePullSecrets: []

auth:
  user: postgres
  # If empty, the chart generates a random password and reuses the existing
  # generated Secret value on upgrades.
  password: ""
  database: postgres
  existingSecret: ""

polardb:
  image: ghcr.io/labring-sigs/polardb-for-postgresql:latest
  imagePullPolicy: IfNotPresent
  port: 5432
  replicaCount: 1

  annotations: {}
  labels: {}
  podAnnotations: {}
  podLabels: {}

  service:
    type: ClusterIP
    annotations: {}

  persistence:
    enabled: true
    storageClass: ""
    accessModes:
      - ReadWriteOnce
    size: 3G
    annotations: {}
    persistentVolumeClaimRetentionPolicy:
      enabled: true
      whenDeleted: Delete
      whenScaled: Retain

  updateStrategy:
    type: RollingUpdate

  podSecurityContext: {}
  securityContext:
    runAsUser: 0

  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

  startupProbe:
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 60
  livenessProbe:
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 6
  readinessProbe:
    initialDelaySeconds: 10
    periodSeconds: 5
    timeoutSeconds: 5
    failureThreshold: 6

  extraEnv: []
  extraVolumeMounts: []
  extraVolumes: []

ha:
  enabled: false
  replicaCount: 3
  leaseName: ""
  leaseDurationSeconds: 30
  retryPeriodSeconds: 5
  primaryWaitSeconds: 600
  shareProcessNamespace: true
  failover:
    enabled: true
    promoteTimeoutSeconds: 60
    maximumLagOnFailoverBytes: "1048576"
    checkTimeline: true
  replication:
    walKeepSize: 1024MB
    maxWalSenders: 10
    maxReplicationSlots: 10
    synchronous:
      enabled: true
      commit: "on"
      standbyNames: "FIRST 1 (*)"
  service:
    replica:
      enabled: true
      type: ClusterIP
      annotations: {}
  manager:
    httpPort: 5001
    livenessProbe:
      initialDelaySeconds: 10
      periodSeconds: 10
      timeoutSeconds: 3
      failureThreshold: 6
    readinessProbe:
      initialDelaySeconds: 5
      periodSeconds: 5
      timeoutSeconds: 3
      failureThreshold: 6
    resources: {}

ferretdb:
  enabled: false
  replicaCount: 1
  image: ghcr.io/ferretdb/ferretdb:2.7.0
  imagePullPolicy: IfNotPresent
  port: 27017
  listenAddr: ":27017"

  annotations: {}
  labels: {}
  podAnnotations: {}
  podLabels: {}

  service:
    type: ClusterIP
    port: 27017
    annotations: {}

  waitForPolardb:
    enabled: true

  podSecurityContext: {}
  securityContext: {}

  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

  livenessProbe:
    initialDelaySeconds: 20
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 6
  readinessProbe:
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 6

  extraEnv: []
  extraVolumes: []
  extraVolumeMounts: []
